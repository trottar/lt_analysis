#! /bin/bash

# Path to the alternate SIMC tree used for background sample generation.
# Example:
#BACKGROUND_SIMC_PATH="/u/group/c-kaonlt/USERS/${USER}/simc_gfortran_backgrounds"
BACKGROUND_SIMC_PATH="/u/group/c-kaonlt/USERS/${USER}/simc_gfortran_tmp"

# Enable or disable individual background jobs.
RUN_NEUTRON=true
RUN_DELTA=true
RUN_SIDIS=true

# recon_hcana.C reaction argument passed through run_simc_tree.
BACKGROUND_REACTION="production"

# Sigma generation is OFF unless --sigma-only is explicitly selected.
# Its external archive, approved base/manifest and private attempt parent are
# required CLI roles (see --sigma-help); none defaults to shared SIMC paths.
# These empty documentation roles do not change legacy job configuration.
KSIGMA0_ARCHIVE=""
KSIGMA0_BASE=""
KSIGMA0_BASE_MANIFEST=""
KSIGMA0_ATTEMPT_PARENT=""
